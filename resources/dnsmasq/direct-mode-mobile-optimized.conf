# Direct-connection mode configuration - MOBILE DEVICE OPTIMIZED
# Used when eth0 is in direct PC connection mode
# Serves DHCP on both AP and ethernet interfaces
# Optimized for modern Android (10+) and iOS (13+) devices with USB-Ethernet adapters

# Listen on specific addresses
listen-address=127.0.0.1
listen-address=192.168.42.1
listen-address=192.168.44.1

# AP interface DHCP range
dhcp-range=192.168.42.10,192.168.42.50,255.255.255.0,24h
dhcp-option=option:router,192.168.42.1

# Direct connection (eth0) DHCP range
# MOBILE OPTIMIZATION: Shorter lease time (2h) for mobile devices
# Rapid lease acquisition helps with USB-Ethernet initialization delays
dhcp-range=192.168.44.10,192.168.44.50,2h

# DHCP Options for direct connections (192.168.44.0/24)
# Option 3 = Router/Gateway
dhcp-option=3,192.168.44.1
# Option 6 = DNS server  
dhcp-option=6,192.168.44.1
# Option 15 = Domain name
dhcp-option=15,fabmo.local
# Option 26 = MTU (important for mobile USB devices)
dhcp-option=26,1500
# Option 28 = Broadcast address
dhcp-option=28,192.168.44.255
# Option 51 = Lease time (7200 seconds = 2 hours)
dhcp-option=51,7200
# Option 58 = Renewal time (3600 seconds = 1 hour)
dhcp-option=58,3600
# Option 59 = Rebinding time (6300 seconds = 1.75 hours)
dhcp-option=59,6300

# Speed up DHCP for direct connections (critical for mobile devices)
dhcp-authoritative
dhcp-rapid-commit

# Act as DNS server for directly connected clients
no-resolv
server=8.8.8.8
server=8.8.4.4
server=1.1.1.1  # Cloudflare as backup

# MOBILE OPTIMIZATION: Handle captive portal detection
# Android connectivity checks
address=/connectivitycheck.gstatic.com/192.168.44.1
address=/clients3.google.com/192.168.44.1
address=/play.googleapis.com/192.168.44.1
address=/android.clients.google.com/192.168.44.1
address=/www.google.com/192.168.44.1
address=/google.com/192.168.44.1

# iOS/iPadOS captive portal checks
address=/captive.apple.com/192.168.44.1
address=/www.apple.com/192.168.44.1

# Microsoft connectivity checks (for Surface tablets, etc.)
address=/www.msftconnecttest.com/192.168.44.1

# Amazon Fire tablets
address=/spectrum.s3.amazonaws.com/192.168.44.1

# MOBILE OPTIMIZATION: Aggressive DNS caching to reduce timeouts
cache-size=1000
min-cache-ttl=60

# MOBILE OPTIMIZATION: Don't delay DHCP replies
dhcp-ignore-names

# Log DHCP for troubleshooting mobile device issues
log-dhcp

# Reduce DNS query timeouts for faster failure (better for mobile)
# If a DNS query fails, fail fast so mobile devices don't wait
strict-order
